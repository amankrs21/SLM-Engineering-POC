[project]
name = "rag-api"
version = "0.1.0"
description = "FastAPI backend for the SLM versus Mistral RAG proof of concept"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.42.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
models = [
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
